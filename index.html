<!DOCTYPE html>
<html>
<head>
    <title>Hello</title> 
    <link rel="stylesheet" href="style.css"><!-- Cascading style sheet. Style.css is in the same folder. -->
</head>
<body>
    <h1>This is my first website</h1>
    <ul> <!-- Unordered list -->
        <li><!-- List item -->
            <a href="https://www.mcdonalds.com/us/en-us.html">Mcdonalds</a> <!-- A is for link -->
        </li>
        <li>
            <a href="https://global.kfc.com/">KFC</a>
        </li>
    </ul>
    <div>
        <img src="https://media.npr.org/assets/img/2013/05/06/ducky062way-47257e1bc12d333c4e0f17e763a683c52ad34f8c.jpg?s=1100&c=85&f=jpeg"><!-- Image tag is img and you don't need a closing tag -->
    </div>
    <div>
        <iframe src="https://www.youtube.com/embed/YU2pLJiptzA"></iframe> <!-- For videos use iframe tag -->
    </div>
</body>
</html>
